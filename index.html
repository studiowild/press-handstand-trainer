<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Still Point</title>
<meta name="description" content="A calm companion for your first press handstand.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f1ede6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Still Point">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=Outfit:wght@200;300;400;500&display=swap">
<style>
/* Layout: every screen is its own scene. The sky-and-sea backdrop re-tints, blurs and zooms per screen;
   type sits directly on it, anchored to the screen's edges. One glass surface at most per screen. */
:root {
  --ink: #fbf8f5;
  --ink-2: rgba(251, 248, 245, .74);
  --ink-3: rgba(251, 248, 245, .5);
  --ink-4: rgba(251, 248, 245, .28);
  --hair: rgba(255, 255, 255, .2);
  --glass: rgba(255, 255, 255, .14);
  --glass-hi: rgba(255, 255, 255, .24);
  --pearl: #fffaf4;
  --pearl-ink: #4b4955;
  --deep: #23222f;
  --glow: #ffd6bd;
  --warn: #ffcf9e;
  --tshadow: 0 1px 18px rgba(16,14,26,.22);
  --tshadow-hero: 0 1px 2px rgba(20,16,34,.25), 0 2px 22px rgba(20,16,34,.35);
  --sheet-tshadow: 0 1px 16px rgba(16,14,26,.25);
  --veil-a: rgba(18,16,30,.32); --veil-0: rgba(18,16,30,0); --veil-b: rgba(18,16,30,.5);
  --tint-c: #0c0b12;
  --shine: rgba(255,255,255,.16);
  --btn-shadow: rgba(0,0,0,.5);
  --danger: #ffc3b8;
  --fade-0: rgba(21,19,31,0); --fade-1: rgba(21,19,31,.4); --fade-2: rgba(21,19,31,.5);
  --tabbar: rgba(255,255,255,.1); --tabbar-line: rgba(255,255,255,.16); --sel: rgba(255,255,255,.18);
  --pool-a: rgba(24,20,40,.42); --pool-b: rgba(24,20,40,.2); --pool-c: rgba(24,20,40,.06);
  --track: rgba(255,255,255,.2); --ring: rgba(255,255,255,.26); --arc: rgba(255,255,255,.75); --dot-glow: #fff;
  --orb-a: rgba(255,255,255,.16); --orb-b: rgba(255,255,255,.02);
  --soft: rgba(255,255,255,.06); --soft-hi: rgba(255,255,255,.22);
  --thumb-ring: rgba(255,255,255,.12); --thumb-shadow: rgba(0,0,0,.3);
  --today-ring: rgba(255,255,255,.25);
  --sheet-scrim: rgba(20,18,32,.38);
  --switch: rgba(255,255,255,.16); --switch-on: rgba(255,255,255,.42); --knob-on: #fffaf4;
  --wheel-glow: rgba(255,214,189,.45);
  --toast: rgba(255,255,255,.18);

  --f-display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Helvetica Neue", system-ui, sans-serif;
  --f-voice: "Newsreader", "Iowan Old Style", Georgia, serif;

  --gutter: 24px;
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: dark;
}
/* Everyday light mode: warm off-white and brown ink. Workout mode (player, check-in) uses the dark set above. */
#device { color: var(--ink); }
#device[data-mode="light"] {
  --ink: #2f2621; --ink-2: rgba(47,38,33,.74); --ink-3: rgba(47,38,33,.54); --ink-4: rgba(47,38,33,.26);
  --hair: rgba(47,38,33,.14); --glass: rgba(255,253,250,.55); --glass-hi: rgba(255,253,250,.8);
  --pearl: #2f2621; --pearl-ink: #f7f3ec; --deep: #f1ede6; --glow: #b9814f; --warn: #a8672c;
  --tshadow: 0 1px 14px rgba(255,251,245,.55);
  --tshadow-hero: 0 0 1px rgba(255,251,245,.6), 0 1px 18px rgba(255,251,245,.7);
  --sheet-tshadow: 0 1px 14px rgba(255,251,245,.5);
  --veil-a: rgba(246,242,236,.45); --veil-0: rgba(246,242,236,0); --veil-b: rgba(246,242,236,.55);
  --tint-c: #f3efe8;
  --shine: rgba(255,255,255,.6);
  --btn-shadow: rgba(60,44,30,.35);
  --danger: #a5432f;
  --fade-0: rgba(243,239,232,0); --fade-1: rgba(243,239,232,.6); --fade-2: rgba(243,239,232,.78);
  --tabbar: rgba(255,253,250,.55); --tabbar-line: rgba(47,38,33,.08); --sel: rgba(47,38,33,.08);
  --pool-a: rgba(250,247,242,.62); --pool-b: rgba(250,247,242,.32); --pool-c: rgba(250,247,242,.08);
  --track: rgba(47,38,33,.14); --ring: rgba(47,38,33,.2); --arc: rgba(47,38,33,.7); --dot-glow: rgba(185,129,79,.6);
  --orb-a: rgba(255,255,255,.5); --orb-b: rgba(255,255,255,.05);
  --soft: rgba(47,38,33,.04); --soft-hi: rgba(255,255,255,.75);
  --thumb-ring: rgba(47,38,33,.08); --thumb-shadow: rgba(60,44,30,.25);
  --today-ring: rgba(47,38,33,.18);
  --sheet-scrim: rgba(246,242,236,.92);
  --switch: rgba(47,38,33,.12); --switch-on: #2f2621; --knob-on: #f7f3ec;
  --wheel-glow: rgba(185,129,79,.3);
  --toast: rgba(255,253,250,.82);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { background: #f1ede6; }
body {
  margin: 0; background: transparent; color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }

/* ---------- Device ---------- */
#device { position: fixed; inset: 0; overflow: hidden; overflow: clip; container: device / size; background: var(--deep); }
.desk-note { display: none; }
@media (hover: hover) and (pointer: fine) and (min-width: 520px) {
  body { background: radial-gradient(ellipse at 50% 30%, #3a3850, #17161f 70%); }
  #device {
    inset: auto; left: 50%; top: 50%; width: 393px; height: 852px;
    transform: translate(-50%, calc(-50% - 12px)) scale(var(--fit, 1));
    border-radius: 54px; box-shadow: 0 0 0 11px #0d0d12, 0 0 0 12px #2c2b36, 0 50px 120px -30px rgba(0,0,0,.8);
  }
  .desk-note { display: block; position: fixed; left: 0; right: 0; bottom: 10px; font-size: 12px; color: var(--ink-3); text-align: center; margin: 0; }
}

/* phone turned sideways: keep the app upright against the phone, clear of the notch */
html[data-rot] #device { --notch: max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
  inset: auto; left: 50%; top: 50%; width: 100vh; height: calc(100vw - var(--notch)); border-radius: 0; box-shadow: none; }
html[data-rot="ccw"] #device { transform: translate(-50%, -50%) rotate(-90deg) translateY(calc(var(--notch) / 2)); }
html[data-rot="cw"] #device { transform: translate(-50%, -50%) rotate(90deg) translateY(calc(var(--notch) / 2)); }

/* ---------- Backdrop: scene + per-screen mood ---------- */
#sea, #veil, #tint { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sea {
  display: block;
  filter: blur(var(--blur, 0px)) saturate(var(--sat, 1));
  transform: scale(var(--zoom, 1));
  transition: filter 1s var(--ease), transform 1.4s var(--ease);
}
#veil { background: linear-gradient(180deg, var(--veil-a) 0%, var(--veil-0) 30%, var(--veil-0) 52%, var(--veil-b) 100%); opacity: var(--veil, 1); transition: opacity 1s var(--ease); }
#tint { background: var(--tint-c); opacity: var(--tint, 0); transition: opacity 1s var(--ease); }
#device[data-mood="home"]     { --blur: 0px;  --zoom: 1;    --tint: 0;   --veil: 1; }
#device[data-mood="practice"] { --blur: 22px; --zoom: 1.12; --tint: .22; --veil: .7; --sat: 1.1; }
#device[data-mood="player"]   { --blur: 30px; --zoom: 1.18; --tint: .7; --veil: .9; --sat: .85; }
#device[data-mood="checkin"]  { --blur: 40px; --zoom: 1.2;  --tint: .72; --veil: .6; --sat: .85; }
#device[data-mood="done"]     { --blur: 12px; --zoom: 1.08; --tint: .06; --veil: .8; }
#device[data-mood="journal"]  { --blur: 26px; --zoom: 1.14; --tint: .28; --veil: .6; }
#device[data-mood="library"]  { --blur: 26px; --zoom: 1.14; --tint: .26; --veil: .6; }

/* ---------- Screens ---------- */
.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 18px) 24px;
}
.scroll::-webkit-scrollbar, .overlay::-webkit-scrollbar, .sheet::-webkit-scrollbar { display: none; }
.view { display: flex; flex-direction: column; min-height: 100%; }
.overlay {
  position: absolute; inset: 0; z-index: 20; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column;
}
/* screens grow with their content and scroll; the player alone is fitted to the screen */
.overlay > .inner { width: 100%; max-width: 460px; margin: 0 auto; flex: 1 0 auto; display: flex; flex-direction: column; }
.overlay > .inner.player-ui { flex: 1 1 0; min-height: 0; }
.overlay { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
body:has(#overlay:not([hidden])) #app { visibility: hidden; }
.grow { flex: 1; min-height: 24px; }
.text-shadow, .view, .overlay { text-shadow: var(--tshadow); }

/* Content lands softly */
.rise { animation: rise .7s var(--ease) both; animation-delay: calc(var(--d, 0) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
/* Screen changes: the old screen is cloned into a ghost layer that fades away above the new one,
   so the backdrop underneath never stops, never dims and never shows an edge. */
.ghost { position: absolute; inset: 0; z-index: 25; pointer-events: none; }
.ghost.page-ghost { z-index: 1; inset: auto; }
.ghost *, .ghost *::before, .ghost *::after { animation: none !important; transition: none !important; }
/* the backdrop takes its time when the mode changes */
#device.shifting #sea { transition: filter 2.4s cubic-bezier(.3,.1,.2,1), transform 2.8s cubic-bezier(.3,.1,.2,1); }
#device.shifting #tint, #device.shifting #veil { transition: opacity 2.4s cubic-bezier(.3,.1,.2,1); }
/* arrival sequence: orb swells, the ring draws itself, then words, then controls */
.arriving .dial .orb { animation: orb-in 1.9s cubic-bezier(.2,.7,.2,1) .5s both, fill-breathe 8s ease-in-out 2.4s infinite; }
@keyframes orb-in { from { opacity: 0; transform: scale(.35); } to { opacity: .78; transform: scale(.985); } }
.arriving .dial .ring { stroke-dasharray: 302; stroke-dashoffset: 302; animation: ring-draw 1.8s cubic-bezier(.65,0,.25,1) .7s forwards; }
@keyframes ring-draw { to { stroke-dashoffset: 0; } }
.arriving .dial .arc, .arriving .dial .dot { animation: fade .8s ease 2s both; }
.arriving .dial .t { animation: rise 1s var(--ease) 1.2s both; }
.arriving .rise { animation-duration: 1s; animation-delay: calc(1.4s + var(--d, 0) * 110ms); }
.arriving .topbar, .arriving .ptrack, .arriving .pmeta { animation: fade 1s ease 1s both; }
.arriving .nextline, .arriving .controls, .arriving .pfoot { animation: rise 1s var(--ease) 1.9s both; }
.arriving .pdots { animation: fade 1s ease 1.8s both; }
.inner.landing .rise { animation-duration: 1s; animation-delay: calc(.6s + var(--d, 0) * 100ms); }
.scroll { touch-action: pan-y; }

/* ---------- Type ---------- */
.label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); }
.label.dim { color: var(--ink-3); }
.numeral { font-family: var(--f-display); font-weight: 200; line-height: .95; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.title { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.12; letter-spacing: -.005em; }
.lede { font-family: var(--f-body); font-weight: 500; font-size: 22px; line-height: 1.42; letter-spacing: .005em; max-width: 24ch; }
.voice { font-family: var(--f-voice); font-style: italic; font-weight: 300; color: var(--ink-2); letter-spacing: .03em; }
.small { font-size: 13px; color: var(--ink-3); }
.rule { width: 26px; height: 1px; background: var(--ink-3); border: 0; margin: 0; }
.hairline { height: 1px; background: var(--hair); }

/* Inline stats split by slanted hairlines */
.stats { display: flex; align-items: flex-start; }
.stats > div { display: flex; flex-direction: column; gap: 2px; padding-right: 18px; position: relative; min-width: 0; }
.stats > div + div { padding-left: 18px; }
.stats > div + div::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 1px; background: var(--hair); transform: skewX(-14deg); }
.stats b { font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

/* ---------- Controls ---------- */
.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 0 28px; border-radius: 999px; font-weight: 500; font-size: 16.5px;
  transition: transform .2s var(--ease), background .3s;
}
.pill:active { transform: scale(.97); }
.pill.primary { background: var(--pearl); color: var(--pearl-ink); text-shadow: none; box-shadow: 0 16px 40px -18px var(--btn-shadow); }
.pill.glass, .circle, .tog, .glass {
  background: var(--glass); border: 1px solid var(--hair);
  -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%);
  box-shadow: inset 0 1px 0 var(--shine);
}
.pill.glass { color: var(--ink); }
.pill.small { min-height: 44px; padding: 0 20px; font-size: 14.5px; }
.pill.wide { width: 100%; }
.pill svg { width: 18px; height: 18px; }
.circle { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; transition: transform .2s var(--ease); }
.circle:active { transform: scale(.94); }
.circle svg { width: 22px; height: 22px; }
.circle.sm { width: 44px; height: 44px; }
.circle.sm svg { width: 19px; height: 19px; }
.circle.solid { background: var(--pearl); color: var(--pearl-ink); border-color: var(--pearl); }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; flex-shrink: 0; }
.icon svg { width: 24px; height: 24px; }
.textbtn { font-size: 14px; color: var(--ink-2); padding: 10px 4px; min-height: 44px; }
.textbtn.danger { color: var(--danger); }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.bottom-bar { display: flex; gap: 12px; align-items: center; padding-top: 16px; }
.bottom-bar .pill.primary { flex: 1; }
.bottom-bar.dock { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); z-index: 2; padding-top: 34px;
  margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); margin-bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, var(--fade-0), var(--fade-1) 55%, var(--fade-2)); }

/* Dev panel + sheet toggles */
.tog { border-radius: 999px; padding: 9px 15px; font-size: 13.5px; color: var(--ink-2); min-height: 40px; }
.tog[aria-pressed="true"] { background: var(--pearl); color: var(--pearl-ink); border-color: var(--pearl); text-shadow: none; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.roundbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--hair); }
.roundbtn svg { width: 20px; height: 20px; }
.btn-text { font-size: 14px; color: var(--ink-2); padding: 10px 0; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Tab bar ---------- */
.tabbar {
  margin: 0 max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  padding: 5px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 999px; flex-shrink: 0;
  background: var(--tabbar); border: 1px solid var(--tabbar-line);
  -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%);
}
.tab { border-radius: 999px; padding: 8px 0 6px; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); transition: background .35s var(--ease), color .35s; }
.tab svg { width: 20px; height: 20px; }
.tab[aria-current="page"] { background: var(--sel); color: var(--ink); }

/* ---------- Home ---------- */
.greet { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 8cqw, 32px); line-height: 1.1; }
.ctrlpill { display: flex; border-radius: 999px; padding: 2px; }
.ctrlpill .icon { width: 42px; height: 40px; }
.ctrlpill .icon svg { width: 20px; height: 20px; }
.week { display: flex; gap: 14px; margin-top: 10px; }
.wd { display: grid; justify-items: center; gap: 5px; font-size: 11px; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
.wd i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--ink-4); }
.wd.done i { background: var(--ink); box-shadow: 0 0 10px var(--glow); }
.wd.today { color: var(--ink); }
.metas { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; }
.metabtn { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); }
.metabtn svg { width: 13px; height: 13px; opacity: .8; }
.metabtn.warm { color: var(--warn); pointer-events: none; }
.hero { display: flex; flex-direction: column; gap: 0; }
.hero .numeral { font-size: clamp(88px, 30cqw, 124px); margin-left: -6px; }
.hero .label { margin-top: 10px; }
.hero .lede { margin-top: 22px; }
.hero .voice { margin-top: 6px; font-size: 15px; line-height: 1.4; max-width: 34ch; }
/* a soft frosted pool behind the hero text: darkens and blurs the scene, then fades to nothing */
.hero:not(.celebrate) { position: relative; isolation: isolate; }
.hero:not(.celebrate)::before {
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  inset: -40% calc(-1 * var(--gutter)) -16% calc(-1 * var(--gutter));
  background: radial-gradient(110% 70% at 18% 58%, var(--pool-a), var(--pool-b) 50%, var(--pool-c) 80%);
  -webkit-backdrop-filter: blur(14px) saturate(115%); backdrop-filter: blur(14px) saturate(115%);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 34%, #000 80%, transparent), linear-gradient(90deg, #000 50%, transparent 96%);
          mask-image: linear-gradient(180deg, transparent, #000 34%, #000 80%, transparent), linear-gradient(90deg, #000 50%, transparent 96%);
  -webkit-mask-composite: source-in; mask-composite: intersect;
}
.hero:not(.celebrate) > * { text-shadow: var(--tshadow-hero); }
.hero + .bottom-bar { padding-top: 34px; }
.celebrate { align-items: center; text-align: center; gap: 0; }
.celebrate .mark { width: 54px; height: 54px; color: var(--ink); filter: drop-shadow(0 0 18px var(--glow)); }
.celebrate .mark svg { width: 100%; height: 100%; }
.celebrate h2 { font-family: var(--f-body); font-weight: 500; font-size: 24px; line-height: 1.4; margin-top: 22px; }
.celebrate .week { margin-top: 30px; justify-content: center; }
.celebrate .wd i { width: 10px; height: 10px; }
.celebrate .small { margin-top: 18px; }
.celebrate .pill { margin-top: 36px; }

/* ---------- Practice ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; margin-inline: -10px; }
.topbar .mid { flex: 1; text-align: center; min-width: 0; font-size: 15px; font-weight: 600; }
.topbar .mid > .label, .topbar .mid small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .mid small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.pick { display: flex; gap: 34px; align-items: flex-end; }
.pick button { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; opacity: .5; transition: opacity .45s var(--ease); text-align: left; min-width: 0; }
.pick button[aria-pressed="true"] { opacity: 1; }

.pick .ind { position: absolute; left: 0; bottom: -.5px; height: 2px; width: 0; border-radius: 2px; background: var(--ink); box-shadow: 0 0 12px var(--glow); z-index: 1; transition: transform .55s var(--ease), width .55s var(--ease); }
.sugpill { display: inline-flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

.pick .numeral { font-size: clamp(64px, 19cqw, 80px); }

.pick .cap { font-size: 13px; color: var(--ink-2); max-width: 12ch; line-height: 1.3; }

.sect { margin-top: 38px; display: flex; flex-direction: column; gap: 16px; }
.plan { display: flex; flex-direction: column; }
.plan div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; font-size: 15px; border-top: 1px solid var(--hair); }

/* ---------- Player ---------- */
.ptrack { display: flex; gap: 4px; margin-top: 6px; }
.ptrack div { height: 2px; border-radius: 2px; background: var(--track); overflow: hidden; position: relative; }
.ptrack i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
/* the dial is pinned at a fixed height; exercise text flows below it, so the timer never moves between exercises */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: 0; min-height: 0; padding-block: clamp(14px, 6cqh, 60px) 10px;
  position: relative; touch-action: pan-y; --pp: 0; --tx: 0px; --ty: 0px; --k: 1; container-type: size; container-name: stage; }
/* the dial takes what the stage can spare after the name and dose */
.dial { position: relative; width: max(150px, min(74cqw, calc(100cqh - 186px), 280px)); container-type: inline-size; aspect-ratio: 1; max-width: 100%; flex-shrink: 0; z-index: 2; cursor: pointer;
  transform: translate(calc(var(--tx) * var(--pp)), calc(var(--ty) * var(--pp))) scale(calc(1 + (var(--k) - 1) * var(--pp))); will-change: transform; }
.dial .t small { opacity: calc(1 - var(--pp) * 2.4); }
.dial .t .numeral { transform: scale(calc(1 + var(--pp) * .22)); }
/* view 1: the timer, name and dose. View 2: the exercise in full, clock tucked top right */
.pv1 { display: flex; flex-direction: column; align-items: center; opacity: calc(1 - var(--pp) * 1.7); transform: translateX(calc(var(--pp) * -32px)); }
.pv2 { position: absolute; inset: 0; z-index: 1; overflow-y: auto; scrollbar-width: none; text-align: left; padding: 18px 0 64px;
  opacity: calc((var(--pp) - .3) * 1.45); transform: translateX(calc((1 - var(--pp)) * 32px)); pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 72px), transparent calc(100% - 30px)); mask-image: linear-gradient(180deg, #000 calc(100% - 72px), transparent calc(100% - 30px)); }
.pv2::-webkit-scrollbar { display: none; }
.stage.on2 .pv2 { pointer-events: auto; }
.stage.on2 .pv1 { pointer-events: none; }
.pv2-head { min-height: 80px; padding-right: 92px; }
.ex-title { font-family: var(--f-display); font-weight: 300; font-size: clamp(27px, 9.4cqw, 36px); line-height: 1.16; margin-top: 14px; }
.ex-dose2 { margin-top: 14px; font-size: 15px; color: var(--ink-2); }
.ex-cue2 { margin-top: 36px; font-family: var(--f-voice); font-style: italic; font-weight: 300; font-size: 19px; line-height: 1.6; letter-spacing: .02em; }
.pv2-sub { display: block; margin-top: 44px; }
.ex-how { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: how; }
.ex-how li { counter-increment: how; display: grid; grid-template-columns: 28px 1fr; gap: 6px; padding: 16px 0; border-top: 1px solid var(--hair); font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
.ex-how li:first-child { border-top: 0; padding-top: 4px; }
.ex-how li::before { content: counter(how); font-size: 12px; font-weight: 600; color: var(--ink-3); padding-top: 4px; font-variant-numeric: tabular-nums; }
.ex-x { margin-top: 14px; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
/* view dots: under the name and dose on the timer, then they settle to the foot of the stage for the details */
.pdots { position: relative; z-index: 3; display: flex; justify-content: center; gap: 0; margin-top: 22px; padding: 4px;
  transform: translateY(calc(var(--dty, 0px) * var(--pp))); }
.pdots button { width: 16px; height: 22px; display: grid; place-items: center; }
.pdots i { width: 6px; height: 6px; border-radius: 3px; background: var(--ink-4); transition: width .45s var(--ease), background .45s var(--ease); }
.pdots [aria-selected="true"] i { width: 14px; background: var(--ink-2); }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dial .ring { fill: none; stroke: var(--ring); stroke-width: .5; }
.dial .arc { fill: none; stroke: var(--arc); stroke-width: .7; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.dial .dot { fill: var(--ink); filter: drop-shadow(0 0 3px var(--dot-glow)); }
.dial .orb { position: absolute; inset: 2%; border-radius: 50%; background: radial-gradient(circle at 50% 36%, var(--orb-a), var(--orb-b) 62%, transparent 100%); animation: fill-breathe 8s ease-in-out infinite; }
@keyframes fill-breathe { 0%, 100% { opacity: .78; transform: scale(.985); } 50% { opacity: 1; transform: scale(1); } }
@keyframes breathe { 0%, 100% { transform: scale(.94); opacity: .8; } 50% { transform: scale(1.04); opacity: 1; } }
.dial .t { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; }
.dial .t .numeral { font-size: clamp(34px, 27cqi, 76px); }
.dial .t small { margin-top: 8px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); }
.ex-name { font-family: var(--f-display); font-weight: 300; font-size: clamp(26px, 9.2cqw, 34px); line-height: 1.15; max-width: 15ch; margin-top: 30px; }
.ex-dose { margin-top: 10px; font-size: 15px; color: var(--ink-2); display: inline-flex; gap: 8px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
.ex-dose .label { color: var(--ink-3); }
.ex-cue { margin-top: 18px; font-size: 17px; line-height: 1.45; max-width: 30ch; }
.ex-more { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }
.nextline { text-align: center; font-size: 13px; color: var(--ink-3); margin-bottom: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nextline b { color: var(--ink-2); font-weight: 500; }
.controls { display: flex; align-items: center; justify-content: center; gap: 26px; }

.pfoot { display: flex; justify-content: center; align-items: center; margin-top: 18px; }

/* ---------- Check-in ---------- */
.steps { display: flex; gap: 6px; justify-content: center; }

.feels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 34px; }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--ink) var(--p, 50%), var(--ink-4) var(--p, 50%)); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 2px; background: var(--ink-4); }

input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--pearl); }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
textarea.bare, input.bare {
  width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--hair); border-radius: 0;
  color: var(--ink); padding: 12px 0; font-size: 17px; line-height: 1.5; resize: none; outline: none;
}

::placeholder { color: var(--ink-4); }
.reveal { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); margin-top: 22px; min-height: 44px; }

.more { display: flex; flex-direction: column; gap: 28px; margin-top: 10px; }

/* ---------- Done ---------- */
.done-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.done-hero .stats { margin-top: 40px; }
.share { margin-top: 26px; border-radius: 26px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; animation: rise .5s var(--ease) both; }
.share pre { margin: 0; white-space: pre-wrap; font-family: var(--f-body); font-size: 14px; line-height: 1.55; color: var(--ink); user-select: all; -webkit-user-select: all; text-shadow: none; }

/* ---------- Journal ---------- */
.page-title { font-family: var(--f-display); font-weight: 400; font-size: 30px; }
.j-hero { margin-top: 34px; }
.j-hero .numeral { font-size: clamp(88px, 28cqw, 116px); margin-left: -5px; }
.j-hero .label { margin-top: 10px; }
.j-hero .voice { margin-top: 12px; font-size: 15px; }
.j-hero .stats { margin-top: 30px; }
.block { margin-top: 46px; display: flex; flex-direction: column; gap: 16px; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 8px; text-align: center; }

.logrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 16px; align-items: center; padding: 14px 0; text-align: left; width: 100%; }

/* ---------- Library ---------- */

/* ---------- Full-screen sheets ---------- */
.sheetwrap {
  position: absolute; inset: 0; z-index: 30;
  background: var(--sheet-scrim);
  -webkit-backdrop-filter: blur(34px) saturate(130%); backdrop-filter: blur(34px) saturate(130%);
  animation: fade .4s var(--ease) both;
}
.sheet {
  height: 100%; overflow-y: auto; scrollbar-width: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 0; max-width: 460px; margin: 0 auto;
  text-shadow: var(--sheet-tshadow);
}
.sheet.closing { animation: sheet-out .3s var(--ease) both; }
.sheet > * { animation: rise .6s var(--ease) both; }
.sheet > *:nth-child(2) { animation-delay: 60ms; } .sheet > *:nth-child(3) { animation-delay: 120ms; } .sheet > *:nth-child(n+4) { animation-delay: 170ms; }
@keyframes sheet-out { to { opacity: 0; transform: translateY(16px); } }
.sheet-head { display: flex; justify-content: flex-end; min-height: 56px; margin-right: -4px; }
.sheet h2.title { margin-top: 6px; }

.opts { margin-top: 30px; display: flex; flex-direction: column; }

.opts > button:first-child { border-top: 0; }

.opts .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.opts .check { width: 22px; height: 22px; margin-top: 12px; opacity: 0; }

.weeks { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; }
.wrow { display: grid; grid-template-columns: 1fr repeat(4, 40px); gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.wcell { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; position: relative; }
.wcell.past { color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.wcell.now { background: var(--pearl); color: var(--pearl-ink); font-weight: 600; text-shadow: none; }
.wcell.dl::after { content: ""; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--warn); }
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 30px; }
input[type="date"].bare { font-family: var(--f-display); font-size: 26px; font-weight: 300; padding: 8px 0; min-height: 52px; }
.setrows { margin-top: 26px; display: flex; flex-direction: column; }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--hair); font-size: 15.5px; }
.setrow:first-child { border-top: 0; }
.setrow small { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.switch { position: relative; width: 50px; height: 30px; border-radius: 99px; background: var(--switch); flex-shrink: 0; transition: background .3s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-2); transition: transform .3s var(--ease), background .3s; }
.switch[aria-checked="true"] { background: var(--switch-on); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--knob-on); }
select.bare { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--hair); color: var(--ink); font-size: 17px; padding: 12px 28px 12px 0; appearance: none; -webkit-appearance: none; border-radius: 0; min-height: 48px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 10px) 50%, calc(100% - 5px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

.ex-sheet .label { margin-top: 8px; }

.ex-sheet .voice { margin-top: 16px; font-size: 17px; line-height: 1.5; max-width: 32ch; }
.confirm { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 0; }
.confirm .sub { margin-top: 12px; }
.confirm .stack { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; margin-top: 40px; }


/* Phase wheel: vertical dial on the left, 16-week rail, details beside */
.sheet > * { flex-shrink: 0; }
.vpick { --wi: clamp(80px, 12.5cqh, 108px); display: grid; grid-template-columns: 84px 4px minmax(0, 1fr); gap: 0 18px; align-items: center; margin-top: clamp(16px, 3.5cqh, 34px); }
.wheel {
  position: relative; height: calc(var(--wi) * 3); overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  display: flex; flex-direction: column; padding-block: var(--wi); scroll-snap-type: y mandatory; overscroll-behavior: contain; touch-action: pan-y;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 26%, #000 74%, transparent); mask-image: linear-gradient(180deg, transparent, #000 26%, #000 74%, transparent);
}
.wheel::-webkit-scrollbar { display: none; }
.wi { flex: 0 0 var(--wi); height: var(--wi); scroll-snap-align: center; display: grid; place-items: center; position: relative; transform-origin: 60% 50%; will-change: transform, opacity; }
.wi .numeral { font-size: calc(var(--wi) * 1.02); line-height: 1; }
.wi.cur::before { content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); }
.wi[aria-current="true"] .numeral { text-shadow: 0 0 40px var(--wheel-glow); }
.ptimeline { display: grid; grid-template-rows: repeat(16, 1fr); gap: 3px; height: calc(var(--wi) * 2.4); width: 3px; }
.ptimeline i { width: 3px; border-radius: 2px; background: var(--ink-4); transition: background .45s var(--ease), transform .45s var(--ease); position: relative; }
.ptimeline i:nth-child(4n):not(:last-child) { margin-bottom: 6px; }
.ptimeline i.in { background: var(--ink); transform: scaleX(1.7); box-shadow: 0 0 10px -2px var(--glow); }
.ptimeline i.now, .ptimeline i.now.in { background: var(--glow); box-shadow: 0 0 10px var(--glow); }
.pdetail { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pdetail > * { transition: opacity .18s ease, transform .18s ease; }
.pdetail.leaving > * { opacity: 0; transform: translateY(-4px); }
.pdetail.swapin > * { animation: pswap .45s var(--ease) both; }
.pdetail.swapin > *:nth-child(2) { animation-delay: 35ms; } .pdetail.swapin > *:nth-child(3) { animation-delay: 70ms; } .pdetail.swapin > *:nth-child(4) { animation-delay: 105ms; }
@keyframes pswap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.pdetail .pname { font-family: var(--f-display); font-weight: 300; font-size: clamp(26px, 8cqw, 32px); line-height: 1.1; }
.pdetail .gate { font-size: 15.5px; }
.pact { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 26px;
  position: sticky; bottom: calc(-28px - env(safe-area-inset-bottom, 0px)); z-index: 2;
  margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); margin-bottom: calc(-28px - env(safe-area-inset-bottom, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, var(--fade-0), var(--fade-1) 45%, var(--fade-2)); }
.pill.is-current { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); cursor: default; }


/* Phase sheet layout: rail spans the full height on the far left; the wheel fills the screen
   so the active number and its details sit exactly at the vertical centre. */
.sheet.phase-sheet { position: relative; overflow: hidden; --wi: clamp(84px, 13cqh, 112px); --rail: max(18px, env(safe-area-inset-left, 0px)); --col: calc(var(--rail) + 22px); }
.phase-sheet .sheet-head { position: relative; z-index: 4; }
.phase-sheet > .title, .phase-sheet > .sub { position: relative; z-index: 3; pointer-events: none; margin-left: calc(var(--col) - max(var(--gutter), env(safe-area-inset-left, 0px))); }
.phase-sheet .prail { position: absolute; z-index: 2; left: var(--rail); top: calc(env(safe-area-inset-top, 0px) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); height: auto; gap: 4px; }
.phase-sheet .prail2 { position: absolute; z-index: 2; left: var(--rail); width: 8px; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(180deg, transparent, #000 8%, #000 92%, transparent); }
.phase-sheet .prail2::before { content: ""; position: absolute; left: 1px; top: 0; bottom: 0; width: 1px; background: var(--hair); }
.phase-sheet .pseg { position: absolute; left: 0; top: 0; width: 3px; display: flex; flex-direction: column; gap: 3px; transform-origin: 0 50%; will-change: transform, height, opacity; }
.phase-sheet .pseg i { flex: 1; min-height: 2px; border-radius: 2px; background: var(--ink); }
.phase-sheet .pseg i.now { background: var(--glow); box-shadow: 0 0 8px var(--glow); }
.phase-sheet .wheel {
  position: absolute; z-index: 1; top: 0; bottom: 0; left: var(--col); right: 0; height: auto; margin: 0;
  padding-block: calc(50cqh - var(--wi) / 2);
  -webkit-mask-image: linear-gradient(180deg, transparent 18%, #000 40%, #000 60%, transparent 82%); mask-image: linear-gradient(180deg, transparent 18%, #000 40%, #000 60%, transparent 82%);
}
.phase-sheet .wi { width: 100%; place-items: center start; padding-left: 14px; transform-origin: 0 50%; transition: transform .16s linear, opacity .16s linear, filter .16s linear; }
.phase-sheet .wheel { scroll-behavior: smooth; }
.phase-sheet .wi { scroll-snap-stop: always; }
.phase-sheet .wi.cur::before { left: 0; }
.phase-sheet .pdetail { position: absolute; z-index: 2; pointer-events: none; top: 0; bottom: 0; left: calc(var(--col) + 14px + var(--wi) * .78); right: max(var(--gutter), env(safe-area-inset-right, 0px)); justify-content: center; }
.phase-sheet .pact { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; margin: 0; padding: 40px max(var(--gutter), env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) var(--col); }


/* ---------- Onboarding ---------- */
.obbar { display: flex; gap: 4px; justify-content: center; }
.obbar i { width: 22px; height: 3px; border-radius: 2px; background: var(--ink-4); transition: background .45s var(--ease); }
.obbar i.on { background: var(--ink); }
.oblist { margin-top: 30px; display: flex; flex-direction: column; }
.oblist button { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 2px; min-height: 58px; border-top: 1px solid var(--hair); text-align: left; font-size: 16.5px; color: var(--ink-2); transition: color .3s; }
.oblist button:first-child { border-top: 0; }
.oblist button > span { display: flex; flex-direction: column; gap: 4px; }
.oblist b { font-weight: 500; }
.oblist em { font-style: normal; }
.oblist small { font-size: 13px; color: var(--ink-3); line-height: 1.4; }
.oblist i { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1.5px var(--ink-4); transition: box-shadow .35s var(--ease); }
.oblist [aria-pressed="true"] { color: var(--ink); }
.oblist [aria-pressed="true"] i { box-shadow: inset 0 0 0 7px var(--ink); }
.obwhy { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; max-width: 38ch; }
.obwhy p { font-size: 15px; color: var(--ink-2); line-height: 1.5; }
.ob .ob-hero .label { margin-top: 0; }

/* ---------- Toast + dev ---------- */
.toast { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%); z-index: 80; padding: 10px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 500; white-space: nowrap; animation: rise .4s var(--ease) both; background: var(--toast); border: 1px solid var(--hair); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.devfab {
  position: absolute; z-index: 60; left: env(safe-area-inset-left, 0px); top: 46%;

  border: 1px dashed rgba(255,255,255,.55); border-left: 0;
  background: rgba(20,18,32,.55); color: var(--ink); font: 600 10.5px/1 var(--f-body); letter-spacing: .14em;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.devfab, #devpanel { --ink: #fbf8f5; --ink-2: rgba(251,248,245,.74); --ink-3: rgba(251,248,245,.5); --hair: rgba(255,255,255,.2); --glass: rgba(255,255,255,.14); --shine: rgba(255,255,255,.16); --pearl: #fffaf4; --pearl-ink: #4b4955; color: var(--ink); color-scheme: dark; }
.devfab.sample { border-style: solid; border-color: var(--warn); color: var(--warn); }
#devpanel { position: absolute; inset: 0; z-index: 70; display: flex; align-items: flex-end; background: rgba(10,10,18,.35); }
#devpanel .dp {
  width: 100%; max-width: 460px; margin: 0 auto; max-height: 78%; overflow-y: auto;
  background: rgba(24, 23, 34, .94); border-top: 1px dashed rgba(255,255,255,.35); border-radius: 22px 22px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; font-size: 13px; animation: rise .3s var(--ease) both;
}
.dp-head { display: flex; justify-content: space-between; align-items: center; }
.dp-head b { font: 600 11px/1 var(--f-body); letter-spacing: .16em; }
.dp-group { display: flex; flex-direction: column; gap: 8px; }
.dp-group > span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.dp-group .toggles { gap: 6px; }
.dp-group .tog { padding: 7px 11px; font-size: 12.5px; min-height: 34px; }
.dp-note { font-size: 12px; color: var(--ink-3); }

/* ---------- Shorter and narrower phones ---------- */
@container device (max-height: 760px) {
  .hero .numeral, .done-hero .numeral, .j-hero .numeral { font-size: clamp(72px, 24cqw, 100px); }
  .hero .lede, .done-hero .lede { margin-top: 16px; font-size: 20px; }
  .done-hero .rule { margin-top: 18px; }
  .hero + .bottom-bar { padding-top: 24px; }
  .ex-name { margin-top: 22px; }
  .ex-cue { margin-top: 12px; font-size: 16px; }
  .controls { gap: 20px; }
  .controls .circle.solid { width: 68px; height: 68px; }
  .sect { margin-top: 28px; }
  .done-hero .stats { margin-top: 26px; }
  .feels { margin-top: 24px; }
  .scale { margin-top: 18px; }
  .scale .numeral { font-size: 40px; }
}
@container device (max-height: 620px) {
  .stage { padding-block: 8px 4px; }
  .ex-name { font-size: 23px; max-width: 20ch; margin-top: 14px; }
  .ex-dose { margin-top: 6px; font-size: 14px; }
  .pfoot { margin-top: 6px; }
  .nextline { margin-bottom: 10px; }
  .controls .circle.solid { width: 62px; height: 62px; }
  .controls .circle { width: 50px; height: 50px; }
  .week { display: none; }
  .hero .voice, .done-hero .voice, .ex-cue { display: none; }
  .hero .numeral, .done-hero .numeral { font-size: 68px; }
  .pick .numeral { font-size: 54px; }
  .plan div { padding: 8px 0; font-size: 14px; }
  .celebrate .pill { margin-top: 24px; }
  .celebrate .mark { width: 42px; height: 42px; }
  .celebrate h2 { font-size: 21px; margin-top: 16px; }
  .celebrate .week { margin-top: 20px; }
}
@container device (max-width: 340px) {
  .scroll, .overlay, .sheet { --gutter: 20px; }
  .stats > div { padding-right: 12px; } .stats > div + div { padding-left: 12px; }
  .stats b { font-size: 15.5px; }
  .pick { gap: 24px; }
  .feels .o { width: 46px; height: 46px; }
  .controls { gap: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
/* ================= Program data (from the Press Handstand Training Plan) ================= */
const EX = {
  C1:{n:'Seated pike leg lifts',d:'3–4 × 8–10, hold last rep 10 s',c:'Hands beside knees, knees locked, lift heels without leaning back.'},
  C2:{n:'Seated straddle leg lifts',d:'3 × 8–10',c:'Hands between or in front of legs; lift both heels, toes pointed.'},
  C3:{n:'Straddle sit / L-sit holds',d:'4 × 10–20 s',c:'Push the floor away, shoulders depressed, hips lifted. Floor or parallettes.'},
  C4:{n:'Compression pulses',d:'3 × 10',c:'Fold forward, then actively pull the chest further down with the hip flexors. No hands.'},
  C5:{n:'Straddle-ups / V-ups',d:'3 × 6–10',c:'Slow, toes to bar or hands; curl the pelvis at the top.'},
  C6:{n:'Hollow body hold',d:'3 × 20–30 s',c:'Lower back glued down, ribs in.'},
  S1:{n:'Pike push-ups → box pike push-ups',d:'3–4 × 5–10',c:'Head travels in front of the hands, elbows track back.'},
  S2:{n:'Planche leans / pseudo-planche push-ups',d:'4 × 15–20 s lean or 4 × 5',c:'Straight arms, shoulders past wrists, protract hard.'},
  S3:{n:'Box pike handstand hold',d:'3 × 20–30 s',c:'Hips stacked over shoulders, push tall through the ears.'},
  S4:{n:'Chest-to-wall walk-downs',d:'3 × 3–5',c:'From chest-to-wall, walk the hands out while the shoulders lean forward. Hips stay over hands as long as possible.'},
  S5:{n:'Wall walks',d:'3 × 3–5',c:'Full vertical at the top, slow descent.'},
  S6:{n:'Wall handstand push-up negatives',d:'3 × 3–5',c:'3–5 s lowers, head to a pad. Eccentric first.'},
  S7:{n:'Straight-arm front raise',d:'3 × 10–12',c:'Locked elbows, raise to overhead. Mimics the press’s shoulder flexion. Dumbbell or plate.'},
  P1:{n:'Elevated straddle press',d:'5–8 singles',c:'Feet on a 30–50 cm box. Shoulders lean first, then the hips float.'},
  P2:{n:'Wall-assisted straddle press negatives',d:'4–6 reps',c:'Back or chest to wall. Lower in 3–5 s to soft feet.'},
  P3:{n:'Freestanding straddle press negatives',d:'4–6 reps',c:'The gold standard. Lower as slowly as you can.'},
  P4:{n:'Partial negatives',d:'3 × 2–3',c:'Lower until the hips start to drop, then press back to vertical.'},
  P5:{n:'Headstand straddle / pike leg raises',d:'3 × 5',c:'Lower the legs until the toes touch, lift back to vertical. Builds hip-over-shoulder control.'},
  P6:{n:'Toe taps / tip-toe press pulls',d:'3 × 3–5',c:'Hands on the floor, feet in straddle. Lean until the feet get light; hover 1–2 s.'},
  P7:{n:'Tuck handstand ↔ handstand',d:'3 × 3–5',c:'Freestanding or with heels near the wall. Hips stay stacked.'},
  P8:{n:'Jumping straddle press',d:'5 singles',c:'Minimal hop; slow the top half. A pattern drill only.'},
  P9:{n:'Full straddle press attempts',d:'3–5 attempts, fresh',c:'Dead stop, no momentum. Stop when quality drops.'},
};
/* Fuller coaching for the player's detail view: how to do each exercise, and the mistake to watch for. */
const EX_HOW = {
  C1:[['Sit tall, legs straight and together, hands flat on the floor beside your knees.','Press the hands down, keep the knees locked and lift both heels a few centimetres.','Pause for a breath, then lower with control. Hold the last rep for 10 s.'],'Leaning back to get the heels up. Stay tall and let the hip flexors do the work.'],
  C2:[['Sit in a wide straddle, toes pointed, hands on the floor between or in front of the legs.','Lift both heels off the floor without rocking back.','Pause at the top, then lower slowly.'],'Bending the knees to clear the floor. Smaller lifts with straight legs count for more.'],
  C3:[['Hands on the floor or parallettes beside the hips.','Push the floor away, shoulders down from the ears, and lift the hips.','Hold the legs up in a straddle or L and keep breathing.'],'Shrugging. Keep the shoulders pressed down so the lift comes from the arms and core.'],
  C4:[['Sit in a pike or straddle with your hands off the floor.','Fold forward, then actively pull the chest further down with the hip flexors.','Pulse in small, controlled reps. No bouncing.'],'Sinking into a passive stretch. Each pulse should feel like a squeeze, not a sag.'],
  C5:[['Hang from a bar, or lie flat with your arms overhead.','Lift the legs slowly toward the hands, curling the pelvis at the top.','Lower under control, without swinging.'],'Using momentum. If you need a swing, slow down or soften the knees.'],
  C6:[['Lie on your back, arms overhead, legs straight.','Press the lower back into the floor and lift the shoulders and legs.','Hold the shape with the ribs drawn in, and breathe.'],'The lower back lifting off the floor. Raise the legs higher until it stays down.'],
  S1:[['Hands shoulder-width apart, hips high in a pike. Put your feet on a box for the harder version.','Lower the head forward of the hands, elbows tracking back.','Press back up until the arms are straight and the shoulders open.'],'Elbows flaring wide. Keep them about 45° from the body to protect the shoulders.'],
  S2:[['Start in a push-up position, fingers turned slightly out.','Lean the shoulders forward past the wrists, arms locked straight.','Protract hard, rounding the upper back a little, and hold.'],'Bending the elbows as you lean. Lean less and keep the arms straight.'],
  S3:[['Feet on a box, hands on the floor, hips folded over the shoulders.','Walk the hands in until the hips stack above the shoulders.','Push tall through the shoulders and hold.'],'Sinking into the shoulders. Keep pushing the floor away for the whole hold.'],
  S4:[['Start in a chest-to-wall handstand.','Walk the hands out slowly as the shoulders lean forward.','Keep the hips over the hands as long as you can, then walk back in.'],'Letting the hips drop early. Walk out a shorter distance and stay stacked.'],
  S5:[['Start in a plank with your feet against the wall.','Walk the feet up and the hands in, all the way to a vertical handstand.','Pause at the top, then walk down slowly.'],'Arching the lower back at the top. Squeeze the glutes and draw the ribs in.'],
  S6:[['Kick up to a wall handstand with a pad under your head.','Lower slowly, over 3–5 s, until your head touches the pad.','Come down from the wall and reset. Lowering only, for now.'],'Dropping the last few centimetres. Control the whole lower, or use a thicker pad.'],
  S7:[['Stand tall with a light dumbbell or plate, elbows locked.','Raise the arms in front of you, all the way overhead.','Lower slowly. This is the press’s shoulder movement.'],'Arching back to finish the lift. Go lighter and keep the ribs down.'],
  P1:[['Feet on a 30–50 cm box in a straddle, hands on the floor in front.','Lean the shoulders over the fingertips until the feet feel light.','Let the hips float up over the hands, then bring the legs together.'],'Jumping off the box. Lean first; the lift should feel slow and floaty.'],
  P2:[['Kick or walk up to a handstand, back or chest to the wall.','Open the legs into a straddle and lean the shoulders forward.','Lower over 3–5 s until the feet land softly near the hands.'],'Bending the elbows on the way down. Lock them and lean more instead.'],
  P3:[['Kick up to a freestanding handstand.','Open to a straddle, lean the shoulders forward and fold at the hips.','Lower as slowly as you can, to soft feet.'],'Losing the lean and dropping to the feet. Dig the fingers in to stay over the hands.'],
  P4:[['From a handstand, begin a straddle lower.','Stop as soon as the hips start to drop.','Press back up to vertical from there.'],'Going too far down. The rep ends the moment the hips start to fall.'],
  P5:[['Set up a stable tripod headstand.','Lower the legs in a straddle or pike until the toes touch the floor.','Lift them back to vertical, hips staying over the shoulders.'],'The hips drifting back as the legs lower. Keep them stacked over your base.'],
  P6:[['Hands on the floor, feet in a wide straddle, up on your toes.','Lean the shoulders forward until the feet feel light.','Hover the toes for 1–2 s, then set them down softly.'],'Hopping. If the feet won’t lift from the lean, lean further rather than jump.'],

/* Each session becomes a list of timed steps. The 45-minute sessions compress the plan's 45–60 min blocks to fit 45. */
function buildSteps(key, phase){
  const ph = PHASES[phase], st = [];
  const add = (block, o) => st.push(Object.assign({block}, o));
  const ex = (code, dose, dur, extra) => ({code, name:EX[code].n, dose, cue:EX[code].c + (extra ? ' ' + extra : ''), dur});
  const prep = blk => {
    add(blk,{name:'Wrist rocks',dose:'Forward and back',cue:'Ease the wrists through their range. Always warm them up before loading.',dur:40});
    add(blk,{name:'Puppy-pose pumps',dose:'10 reps',cue:'Sink the chest toward the floor, then press back up.',dur:40});
    add(blk,{name:'Scap push-ups',dose:'10 reps',cue:'Arms straight. Let the shoulder blades meet, then push the floor away.',dur:40});
  };
  const press = (blk, drills, total, note) => drills.forEach(([c,d]) => add(blk, ex(c, d, Math.round(total/drills.length), note)));
  const warm45 = () => {
    const b = 'Warm-up';
    add(b,{name:'Wrist prep',dose:'Rocks + 10 puppy-pose pumps',cue:'Wrists take the most load. Warm them fully.',dur:60});
    add(b,{name:'Cat-cow',dose:'Slow, with the breath',cue:'Move one segment of the spine at a time.',dur:45});
    add(b,{name:'Scap push-ups',dose:'10 reps',cue:'Arms straight. Let the shoulder blades meet, then push away.',dur:45});
    add(b, ex('C6','2 × 30 s',90));
    add(b, ex('S5','1–2 reps',120));
  };
  if (key === 'A' || key === 'C') {
    prep('Wrist + shoulder prep');
    if (key === 'A') {
      add('Handstand primer',{name:'Handstand hold',dose:'Attempt 1 of 2 · 20–30 s',cue:'Chest-to-wall or freestanding. Rest for the rest of the minute.',dur:60});
      add('Handstand primer',{name:'Handstand hold',dose:'Attempt 2 of 2 · 20–30 s',cue:'Push tall through the ears. Rest for the rest of the minute.',dur:60});
      press('Press block', ph.A, 360, 'Rest 30–45 s between reps.');
      add('Compression', ex('C1','3 × 8',150,'Back to back with C4, 20 s rest.'));
      add('Compression', Object.assign(ex('C4','Pancake pulses · 2 × 10',150)));
    } else {
      add('Balance primer', ex('P7','2–3 tuck handstand attempts',120));
      press('Press block', ph.C, 360, 'Quality over count.');
      add('Compression', ex('C2','3 × 8',150));
      add('Compression', ex('C3','3 × 10–15 s',150));
    }
  } else if (key === 'B') {
    warm45();
    add('Handstand practice',{name:'Handstand practice',dose:'Aim for 3–5 min total inverted',cue:'Freestanding attempts or chest-to-wall holds. Rest whenever the line slips.',dur:480});
    press('Press skill', ph.BD, 480, '4–6 quality reps.');
    const s1 = phase === 1 ? 'Floor pike push-ups' : 'Box pike push-ups', lean = phase === 1 ? '15 s' : '20 s';
    const cut = phase === 4 ? ' Volume cut ~25% this phase.' : '';
    for (let r = 1; r <= 4; r++) {
      add('Shoulder strength', Object.assign(ex('S1','Round '+r+' of 4 · 5–8 reps',90, cut), {name:s1}));
      add('Shoulder strength', Object.assign(ex('S2','Round '+r+' of 4 · lean '+lean,90), {name:'Planche leans'}));
    }
    add('Compression strength', ex('C5', phase >= 3 ? '3 × 6–8 · harder variation' : '3 × 6–8', 180));
    add('Compression strength', ex('C1','3 × 10',180));
    add('Flexibility',{name:'Pike fold',dose:'2 × 60 s',cue:'Active pulses between holds. Pull the chest down with the hip flexors.',dur:150});
    add('Flexibility',{name:'Pancake fold',dose:'2 × 60 s',cue:'Legs wide, active pulses between holds.',dur:150});
  } else {
    warm45();
    add('Handstand practice',{name:'Freestanding practice',dose:'Holds and attempts',cue:'Keep 3–5 min inverted today. The press finishes in a handstand.',dur:270});
    add('Handstand practice', ex('P7','3 tuck ↔ straight transitions',150));
    press('Press skill', ph.BD, 600, phase >= 3 ? 'Full attempts go here, while fresh.' : '');
    const useS6 = phase >= 3, cut = phase === 4 ? ' Volume cut ~25% this phase.' : '';
    for (let r = 1; r <= 3; r++) {
      add('Straight-arm strength', useS6 ? ex('S6','Round '+r+' of 3 · 3–5 reps',90,cut) : ex('S3','Round '+r+' of 3 · 20–30 s',90,cut));
      add('Straight-arm strength', ex('S4','Round '+r+' of 3 · 3 reps',90));
    }
    add('Straight-arm strength', ex('S7','2 × 12, light',180));
    add('Compression + flexibility', ex('C3','4 × 15 s',180));
    add('Compression + flexibility', Object.assign(ex('C4','Straddle pulses · 3 × 10',180)));
    add('Compression + flexibility',{name:'Pancake stretch',dose:'2 × 60 s',cue:'Breathe into the fold. Keep the legs active.',dur:240});
  }
  return st;
}

}

/* ================= Program math ================= */
function programWeek(){ return Math.max(1, Math.floor(dayDiff(S.profile.startDate, todayISO()) / 7) + 1); }
function currentPhase(){ return S.profile.phase || Math.min(4, Math.ceil(programWeek() / 4)); }
function isDeload(){ const w = programWeek(); return w <= 16 && w % 4 === 0; }

function lastOf(key){ for (let i = S.sessions.length - 1; i >= 0; i--) if (S.sessions[i].key === key) return S.sessions[i]; return null; }
/* The rotation follows the weekly goal: 2 days A·B, 3 days A·B·D, 4 days A·B·C·D. */
function suggestNext(){
  const rot = ROTATION[weeklyGoal()], last = S.sessions[S.sessions.length - 1];
  if (!last) return rot[0];
  for (let i = 1; i <= 4; i++) { const k = 'ABCD'[('ABCD'.indexOf(last.key) + i) % 4]; if (rot.includes(k)) return k; }
  return rot[0];
}
function suggestFor(len){
  const next = suggestNext();
  if (META[next].len === len) return next;
  const inRot = (len === 15 ? ['A','C'] : ['B','D']).filter(k => ROTATION[weeklyGoal()].includes(k));
  if (inRot.length === 1) return inRot[0];
  const [x, y] = len === 15 ? ['A','C'] : ['B','D'];
  const lx = lastOf(x), ly = lastOf(y);
  if (!lx) return x; if (!ly) return y;
  return lx.ts <= ly.ts ? x : y;
}
function streakInfo(){
  const days = [...new Set(S.sessions.map(s => s.date))].sort();
  if (!days.length) return {cur:0, best:0};
  let best = 1, run = 1;
  const gap = weeklyGoal() >= 3 ? 3 : 4;   // fewer practice days allow longer rests between sessions
  for (let i = 1; i < days.length; i++) { run = dayDiff(days[i-1], days[i]) <= gap ? run + 1 : 1; best = Math.max(best, run); }
  const alive = dayDiff(days[days.length-1], todayISO()) <= gap;
  return {cur: alive ? run : 0, best};
}

const DAYNAME = {Mon:'Monday', Tue:'Tuesday', Thu:'Thursday', Sat:'Saturday'};
const LETTERS = ['M','T','W','T','F','S','S'];
function weekDots(withKeys){
  const ws = weekStart(new Date()), byDay = {};
  S.sessions.forEach(s => { if (s.date >= ws) byDay[s.date] = s.key; });
  return LETTERS.map((l, i) => { const d = parseISO(ws); d.setDate(d.getDate() + i); const iso = isoDate(d);
    return `<div class="wd${byDay[iso] ? ' done' : ''}${iso === todayISO() ? ' today' : ''}"><span>${l}</span><i></i></div>`; }).join('');
}
function pressDrills(key, phase){ return PHASES[phase][key === 'A' || key === 'C' ? key : 'BD']; }

/* ================= Practice ================= */
function openPractice(){ ui.len = null; ui.key = null; ui.ind = null; swap(() => renderPractice(true)); }
function renderPractice(first){
  const nextKey = suggestNext();
  if (!ui.len) ui.len = META[nextKey].len;
  const sug = suggestFor(ui.len);
  if (!ui.key || META[ui.key].len !== ui.len) ui.key = sug;
  const phase = currentPhase(), steps = buildSteps(ui.key, phase), blocks = blocksOf(steps);
  const pair = ui.len === 15 ? ['A','C'] : ['B','D'], last = S.sessions[S.sessions.length - 1];
  let hint = '';
  if (!last && ui.key !== 'A') hint = 'The plan opens with <b>Session A</b>, but Session ' + ui.key + ' works too' + (META[ui.key].len === 45 ? ' if you want the longer session today.' : '.');
  else if (last && last.date === todayISO()) hint = 'You already trained today. The plan calls for rest or 10 minutes of easy mobility.';
  else if (last && META[ui.key].len === 45 && META[last.key].len === 45 && dayDiff(last.date, todayISO()) <= 1) hint = 'Keep a rest day between the two strength days.';
  setMood('practice', ui.key);
  const r = first ? 'rise' : '';
  const o = $('#overlay');
  o.innerHTML = `<div class="inner">
    <div class="topbar"><button class="icon" id="pr-close" aria-label="Close">${I.close}</button>
      <div class="mid">Today’s practice<small>Phase ${phase} · ${PHASES[phase].n}${isDeload() ? ' · deload' : ''}</small></div><span class="icon"></span></div>
    <div class="sect ${r}" style="--d:1"><span class="label">Select length</span>
      <div class="pick" data-g="len" role="radiogroup" aria-label="Select length"><i class="ind" aria-hidden="true"></i>
        ${[15,45].map(l => `<button role="radio" data-len="${l}" aria-pressed="${ui.len === l}" aria-checked="${ui.len === l}"><span class="foot">${l === META[nextKey].len ? '<span class="sugpill">Suggested</span>' : ''}</span><span class="numeral">${l}<small>min</small></span></button>`).join('')}
      </div></div>
    <div class="sect ${r}" style="--d:2"><span class="label">Select session</span>
      <div class="pick" data-g="key" role="radiogroup" aria-label="Select session"><i class="ind" aria-hidden="true"></i>
        ${pair.map(k => `<button role="radio" data-key="${k}" aria-pressed="${ui.key === k}" aria-checked="${ui.key === k}"><span class="foot">${k === sug ? '<span class="sugpill">Suggested</span>' : ''}</span><span class="numeral">${k}</span><span class="cap">${META[k].n}</span></button>`).join('')}
      </div></div>
    <div class="sect ${r}" style="--d:3"><span class="label dim">The plan</span>
      <div class="plan">${blocks.map(b => `<div><span>${esc(b.name)}</span><span>${Math.round(b.dur/60)} min</span></div>`).join('')}</div>
      ${hint ? `<p class="note">${hint}</p>` : ''}</div>
    <div class="grow"></div>
    <div class="bottom-bar dock ${r}" style="--d:4"><button class="pill primary" id="b-start">Begin Session ${ui.key}</button></div>
  </div>`;
  o.hidden = false;
  // slide each group's underline from where it was to the new choice
  o.querySelectorAll('.pick').forEach(pk => {
    const sel = pk.querySelector('[aria-pressed="true"]'), ind = pk.querySelector('.ind'), g = pk.dataset.g;
    const to = { l: sel.offsetLeft, w: sel.offsetWidth }, from = ui.ind && ui.ind[g];
    if (from && !first) { ind.style.transition = 'none'; ind.style.transform = `translateX(${from.l}px)`; ind.style.width = from.w + 'px'; void ind.offsetWidth; ind.style.transition = ''; }
    ind.style.transform = `translateX(${to.l}px)`; ind.style.width = to.w + 'px';
    (ui.ind = ui.ind || {})[g] = to;
  });
  $('#b-start').onclick = () => { buzz([10, 50, 14]); swap(() => startPlayer(ui.key), 'enter'); };
  $('#pr-close').onclick = closePractice;
  o.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { if (ui.len === +b.dataset.len) return; ui.len = +b.dataset.len; ui.key = suggestFor(ui.len); renderPractice(); });
  o.querySelectorAll('[data-key]').forEach(b => b.onclick = () => { ui.key = b.dataset.key; renderPractice(); });
}
function closeOverlay(){ const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }

/* ================= Journal ================= */
function earnedMilestones(){ const m = new Map(); S.sessions.forEach(s => (s.milestones || []).forEach(x => { if (!m.has(x)) m.set(x, s.date); })); return m; }
function bestOf(field){ let best = null; S.sessions.forEach(s => { const v = s.bench && s.bench[field]; if (v && (!best || v > best.v)) best = {v, date:s.date}; }); return best; }
function renderJournal(){
  if ($('#overlay').hidden) setMood('journal', 'N');
  const st = streakInfo(), wk = thisWeek(), total = S.sessions.reduce((a, s) => a + (s.secs || 0), 0), ms = earnedMilestones();
  const now = new Date();
  if (!ui.calMonth) ui.calMonth = [now.getFullYear(), now.getMonth()];
  const [cy, cm] = ui.calMonth, first = new Date(cy, cm, 1), daysIn = new Date(cy, cm + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const byDate = {}; S.sessions.forEach(s => (byDate[s.date] = byDate[s.date] || []).push(s.key));
  let cal = LETTERS.map(d => `<div class="dow">${d}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let d = 1; d <= daysIn; d++) {
    const iso = isoDate(new Date(cy, cm, d)), ks = byDate[iso];
    cal += `<div class="day${ks ? ' has' : ''}${iso === todayISO() ? ' today' : ''}" title="${ks ? 'Session ' + ks.join(', ') + ', ' : ''}${niceDate(iso)}">${ks ? ks[ks.length - 1] : d}</div>`;
  }
  const fs = bestOf('fs'), ctw = bestOf('ctw');
  const bench = (label, best, target) => {
    const v = best ? best.v : 0, max = target * 1.15;
    return `<div class="bench"><div class="row between"><span>${label}</span><span><span class="numeral">${best ? v : '—'}</span>${best ? '<span class="small"> s</span>' : ''}</span></div>
      <div class="track" role="img" aria-label="${label}: best ${v} seconds, press-ready target ${target} seconds"><i style="width:${Math.min(100, v / max * 100)}%"></i><em style="left:${target / max * 100}%"></em></div>
      <span class="small">Press-ready at ${target} s${best ? ' · best on ' + niceDate(best.date) : ''}</span></div>`;
  };
  const list = S.sessions.slice().reverse();
  $('#v-journal').innerHTML = `
    <h1 class="page-title">Progress</h1>
    ${S.sessions.length ? `
    <div class="j-hero">
      <span class="numeral rise">${st.cur}</span>
      <span class="label rise" style="--d:1">Session streak</span>
      <p class="voice rise" style="--d:2">${st.best > st.cur ? 'Best run, ' + st.best + ' sessions' : 'Your longest run yet'}</p>
      <div class="stats rise" style="--d:3">
        <div><b>${wk.length}/${weeklyGoal()}</b><span>This week</span></div>
        <div><b>${S.sessions.length}</b><span>Sessions</span></div>
        <div><b>${fmtMins(total)}</b><span>On the mat</span></div>
      </div>
    </div>` : `
    <div class="empty j-hero"><p class="voice rise">The first session is the hardest one to start.</p><p class="small rise" style="--d:1">Finish a session and it lands here, with how it felt. Your streak holds while no more than two rest days fall between sessions.</p></div>`}
    <div class="block rise" style="--d:4">
      <div class="row between"><span class="label">${first.toLocaleDateString(undefined, {month:'long', year:'numeric'})}</span>
        <div class="row" style="gap:0;margin-right:-10px"><button class="icon" id="cal-prev" aria-label="Previous month">${I.chevL}</button><button class="icon" id="cal-next" aria-label="Next month">${I.chev}</button></div></div>
      <div class="cal">${cal}</div>
    </div>
    ${fs || ctw ? `<div class="block"><span class="label">Benchmarks</span>${bench('Freestanding hold', fs, 20)}${bench('Chest-to-wall hold', ctw, 90)}</div>` : ''}
    ${ms.size ? `<div class="block"><span class="label">Milestones · ${ms.size} of ${MILESTONES.length}</span><div class="list">${[...ms].map(([n, d]) => `<div class="ms"><span>${esc(n)}</span><span>${niceDate(d)}</span></div>`).join('')}</div></div>` : ''}
    ${list.length ? `<div class="block"><span class="label">Sessions</span><div class="list">${list.map(s => `<button class="logrow" data-sid="${s.id}">
        <span class="numeral">${s.key}</span>
        <span class="mid"><span class="t">${META[s.key].n}</span><span class="s">${[s.feel, s.notes].filter(Boolean).map(esc).join(' · ') || 'Energy ' + (s.energy || '–') + '/10'}</span></span>
        <span class="d">${niceDate(s.date)}<br>${fmtMins(s.secs || 0)}</span></button>`).join('')}</div></div>` : ''}
    <p class="small" style="margin-top:40px;text-align:center">${synced ? 'Saved to your account' : 'Saved on this device'}</p>`;
  $('#cal-prev').onclick = () => { let [y,m] = ui.calMonth; m--; if (m < 0) { m = 11; y--; } ui.calMonth = [y,m]; renderJournal(); };
  $('#cal-next').onclick = () => { let [y,m] = ui.calMonth; m++; if (m > 11) { m = 0; y++; } ui.calMonth = [y,m]; renderJournal(); };

function dragToDismiss(sh){

function exportLog(){
  const R = DEV.real || S;
  const data = { app: 'still-point', version: 1, exported: new Date().toISOString(), profile: R.profile, sessions: R.sessions };
  const name = 'still-point-' + todayISO() + '.json';
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const file = typeof File === 'function' ? new File([blob], name, { type: 'application/json' }) : null;
  // iPhone home-screen apps can't download files; the share sheet's "Save to Files" can
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && window.top === window) {
    navigator.share({ files: [file], title: 'Still Point backup' }).catch(() => {});
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup saved');
}
async function importLog(file){
  if (DEV.real) { toast('Switch dev data back to My data first'); return; }
  let data; try { data = JSON.parse(await file.text()); } catch (e) { toast('That file couldn’t be read'); return; }
  const list = data && Array.isArray(data.sessions) ? data.sessions : null;
  if (!list || data.app !== 'still-point') { toast('That isn’t a Still Point backup'); return; }
  const have = new Set(S.sessions.map(s => s.id));
  const fresh = list.filter(r => r && typeof r.id === 'string' && typeof r.ts === 'number' && typeof r.date === 'string' && !have.has(r.id));
  fresh.forEach(r => { S.sessions.push(r); putRemote(r.id, Object.assign({kind:'session'}, r)); });
  S.sessions.sort((a, b) => a.ts - b.ts);
  // take the backup's setup only when this device hasn't been set up yet
  if (data.profile && typeof data.profile === 'object' && (!S.profile.onboarded || !S.profile.assess)) {
    const keep = { voiceName: S.profile.voiceName };
    S.profile = Object.assign(S.profile, data.profile, keep, { onboarded: true });
    putRemote('profile', Object.assign({kind:'profile'}, S.profile));
  }
  saveLocal(); closeSheet();
  if (OB && !OB.edit) { OB = null; closeOverlay(); }
  renderAll();
  toast(fresh.length ? 'Restored ' + fresh.length + ' session' + (fresh.length === 1 ? '' : 's') : 'Everything was already here');
}

/* Each question maps to one of the plan's benchmarks; together they test the phase gates. */
const SKILLS = [
  { k:'ctw', ask:'How long can you hold a chest-to-wall handstand?', hint:'Belly to the wall, hands about 10 cm out.',
    opts:['Not yet', 'Under 30 seconds', '30 to 60 seconds', '60 seconds or more'] },
  { k:'fs', ask:'And freestanding, away from the wall?', hint:'Your best of three tries.',
    opts:['Not yet', 'A second or two', '5 to 15 seconds', '20 seconds or more'] },
  { k:'comp', ask:'How many seated pike leg lifts can you do?', hint:'Legs straight, hands beside your knees, lift both heels.',
    opts:['My heels won’t lift', 'A brief hover', 'A few reps', '8 or more'] },
  { k:'neg', ask:'Can you lower down from a handstand slowly?', hint:'A straddle lowering with straight arms, no collapse.',
    opts:['Haven’t tried it', 'Against a wall, about 3 seconds', 'Freestanding, landing softly', 'Freestanding, 5 seconds or slower'] },
  { k:'press', ask:'Can you press up into a handstand?', hint:'Lifting into it with no jump.',
    opts:['Not yet', 'From a high box', 'My toes float off the floor', 'A full press from the floor'] },
];
const GOALS = [
  { n:2, t:'Two days', d:'Sessions A and B. One short, one long. Steady, sustainable progress.' },
  { n:3, t:'Three days', d:'Sessions A, B and D. One short press day, two strength days.' },
  { n:4, t:'Four days', d:'The full plan: A, B, C and D. The fastest route to your first press.' },
];
const ROTATION = { 2:['A','B'], 3:['A','B','D'], 4:['A','B','C','D'] };
function weeklyGoal(){ return ROTATION[S.profile.goal] ? S.profile.goal : 4; }

/* Walk the gates in order; a phase is earned only when every gate before it is passed. */
function mapPhase(a){
  const g1 = a.ctw >= 3 && a.neg >= 1 && a.comp >= 3;
  const g2 = g1 && a.neg >= 2 && a.press >= 1;
  const g3 = g2 && a.neg >= 3 && a.press >= 2;
  let phase = g3 ? 4 : g2 ? 3 : g1 ? 2 : 1;
  const why = [];
  if (g1) why.push('You’ve passed the Foundation gate: a 60 s chest-to-wall hold, a controlled wall negative and 8 pike lifts.');
  if (g2) why.push('You’ve passed the Lowering gate: a soft freestanding negative and an elevated press.');
  if (g3) why.push('You’ve passed the Pressing gate: a slow freestanding negative and a toe hover.');
  const volume = a.ctw < 2 || a.fs < 2;
  if (volume && phase > 1) { phase = 1; why.length = 0; }
  if (volume) why.push('Your handstand hold is still building, so you’ll start with Foundation and lean on handstand time for the first four weeks, as the plan recommends.');
  else if (phase === 1) {
    const miss = [];
    if (a.ctw < 3) miss.push('a 60 s chest-to-wall hold');
    if (a.neg < 1) miss.push('a controlled wall negative');
    if (a.comp < 3) miss.push('8 pike lifts');
    why.push('Foundation builds ' + miss.join(', ').replace(/, ([^,]*)$/, ' and $1') + ', the base every press stands on.');
  }
  return { phase, why };
}

  const ms = {3:'45 s chest-to-wall', 7:'3 s controlled wall negative', 11:'First 10 s freestanding', 15:'60 s chest-to-wall', 18:'Filmed a set from the side'};
  let n = 0;

    if (!key || (back > 7 && (back * 7) % 11 === 3)) continue;
    n++;

    base.sessions.push({ id: 'dev' + n, ts: d.getTime(), date: isoDate(d), key, phase, week, secs: len * 60 - (n % 3) * 40, done: 9, total: 9, complete: true,

  ['Library', LIBTABS.map(([k, n]) => [n, () => { ui.libTab = k; goTab('library'); }])],
  ['Sheets', [
    ['Phase', () => { goTab('home'); openPhaseSheet(); }], ['Week', () => { goTab('home'); openWeekSheet(); }], ['Sound', () => { goTab('home'); openSettings(); }],
    ['Exercise P3', () => openExercise('P3')],
    ['Session detail', () => { goTab('journal'); const s = S.sessions[S.sessions.length - 1]; if (s) openSessionDetail(s.id); else toast('No sessions in this data set'); }],
  ]],
];
function openDevPanel(){
  const dp = $('#devpanel');
  const data = [['real','My data'],['new','New user'],['mid','Mid-program'],['today','Trained today']];
  dp.innerHTML = `<div class="dp" role="dialog" aria-label="Dev controls">
    <div class="dp-head"><b>DEV CONTROLS</b><button class="roundbtn" id="dp-close" aria-label="Close dev controls" style="width:36px;height:36px">${I.close}</button></div>
    <div class="dp-group"><span>Data</span><div class="toggles">${data.map(([k, n]) => `<button class="tog" data-dd="${k}" aria-pressed="${DEV.sample === k}">${n}</button>`).join('')}</div>
      <p class="dp-note">${DEV.sample === 'real' ? 'Showing your real log. Preview screens never save.' : 'Sample data in use. Nothing you do is saved until you switch back to My data.'}</p></div>
    ${DEV_VIEWS.map(([g, items], gi) => `<div class="dp-group"><span>${g}</span><div class="toggles">${items.map(([n], i) => `<button class="tog" data-dv="${gi}:${i}">${n}</button>`).join('')}</div></div>`).join('')}
    <div class="dp-group"><span>Player speed</span><div class="toggles">${[1, 10, 60].map(x => `<button class="tog" data-ds="${x}" aria-pressed="${DEV.speed === x}">${x}×</button>`).join('')}</div></div>
    <button class="btn-text" id="dp-hide" style="align-self:flex-start;padding-left:0">Hide dev controls on this device</button>
  </div>`;
  dp.hidden = false;
  dp.onclick = e => { if (e.target === dp) closeDevPanel(); };
  $('#dp-close').onclick = closeDevPanel;
  dp.querySelectorAll('[data-dd]').forEach(b => b.onclick = () => { devReset(); devUseData(b.dataset.dd); goTab(ui.tab); openDevPanel(); });
  dp.querySelectorAll('[data-dv]').forEach(b => b.onclick = () => { const [g, i] = b.dataset.dv.split(':').map(Number); closeDevPanel(); devReset(); DEV_VIEWS[g][1][i][1](); });
  dp.querySelectorAll('[data-ds]').forEach(b => b.onclick = () => { DEV.speed = +b.dataset.ds; openDevPanel(); });
  $('#dp-hide').onclick = () => { try { localStorage.setItem('stillpoint.dev', 'off'); } catch (e) {} closeDevPanel(); const f = document.querySelector('.devfab'); f && f.remove(); toast('Add #dev to the link to bring them back'); };
}
function closeDevPanel(){ const dp = $('#devpanel'); dp.hidden = true; dp.innerHTML = ''; }
function showDevFab(force){
  if (document.querySelector('.devfab')) return;
  let off = false; try { off = localStorage.getItem('stillpoint.dev') === 'off'; } catch (e) {}
  if (off && !force) return;
  if (force) try { localStorage.removeItem('stillpoint.dev'); } catch (e) {}
  const b = document.createElement('button'); b.className = 'devfab'; b.textContent = 'DEV'; b.setAttribute('aria-label', 'Open dev controls');
  b.onclick = openDevPanel; $('#device').appendChild(b);
}
if (location.hash === '#dev' || /[?&]dev\b/.test(location.search)) showDevFab(true);

const initialTab = { journal:'journal', progress:'journal', library:'library' }[location.hash.slice(1)] || null;
renderHome();
if (initialTab) goTab(initialTab);
maybeOnboard();

/* Installed app: work offline. Not inside Claude, where the page is sandboxed. */
if ('serviceWorker' in navigator && !window.claude && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
